name: Editorial quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection tools
        run: brew list poppler >/dev/null 2>&1 || brew install poppler
      - name: Install EPUBCheck
        run: brew list epubcheck >/dev/null 2>&1 || brew install epubcheck
      - name: Install image inspection tools
        run: |
          python3 -m venv .ci-image-tools
          .ci-image-tools/bin/python -m pip install Pillow reportlab==5.0.0
      - name: Validate manifest headers and CSV shape
        run: |
          scripts/validate_manifests.sh
          ruby -rcsv -e '
            ARGV.each do |file|
              rows = CSV.read(file)
              abort("malformed CSV: #{file}") unless rows.all? { |row| row.length == rows.first.length }
            end
          ' assets/source/manifest.csv assets/generated/manifest.csv design/plate-manifest.csv design/asset-checksums.csv design/iliad-plate-selection.csv design/odyssey-plate-selection.csv
      - name: Run asset preflight
        run: scripts/preflight_assets.rb
      - name: Run image metadata preflight
        run: python3 scripts/preflight_image_metadata.py
      - name: Run illustration placeholder preflight
        run: ruby scripts/preflight_illustration_placeholders.rb
      - name: Run provenance preflight
        run: ruby scripts/preflight_provenance.rb
      - name: Verify Homer print-review art
        run: .ci-image-tools/bin/python scripts/preflight_homer_print_art.py
      - name: Rebuild and verify plate-selection audit
        run: |
          python3 scripts/build_plate_selection_audit.py
          git diff --exit-code -- design/plate-selection-audit.csv design/plate-selection-audit.md
      - name: Rebuild and verify plate review contact sheet
        run: |
          .ci-image-tools/bin/python scripts/build_plate_review_contact_sheet.py --output /tmp/plate-review-contact-sheet.jpg
          .ci-image-tools/bin/python scripts/build_plate_review_contact_sheet.py --verify design/plate-review-contact-sheet.jpg
      - name: Rebuild and verify Bookvault prepress interiors
        run: |
          .ci-image-tools/bin/python scripts/build_bookvault_interiors.py
          .ci-image-tools/bin/python scripts/validate_bookvault_interiors.py
      - name: Rebuild and verify plate asset checksums
        run: |
          python3 scripts/build_asset_checksums.py
          git diff --exit-code -- design/asset-checksums.csv
      - name: Rebuild and verify production preflight report
        run: |
          python3 scripts/build_preflight_report.py
          git diff --exit-code -- design/preflight-report.md
      - name: Run font license preflight
        run: ruby scripts/preflight_fonts.rb
      - name: Run translation structure preflight
        run: scripts/preflight_translation.rb
      - name: Run translation completeness preflight
        run: ruby scripts/preflight_translation_completeness.rb
      - name: Run collation-section preflight
        run: python3 scripts/preflight_collation_sections.py
      - name: Run manuscript duplication preflight
        run: python3 scripts/preflight_manuscript_duplicates.py
      - name: Run translation density preflight
        run: |
          ruby scripts/preflight_translation_density.rb
          git diff --exit-code -- design/translation-density-report.md
          python3 scripts/build_translation_expansion_plan.py
          git diff --exit-code -- design/translation-expansion-plan.md
      - name: Run review-packet coverage preflight
        run: ruby scripts/preflight_review_packets.rb
      - name: Run read-aloud coverage preflight
        run: ruby scripts/preflight_read_aloud.rb
      - name: Run source-lock preflight
        run: ruby scripts/preflight_source_lock.rb
      - name: Rebuild and verify Greek source coverage ledger
        run: |
          python3 scripts/build_source_coverage.py
          git diff --exit-code -- text/source-coverage.csv
      - name: Run PDF geometry preflight
        run: python3 scripts/preflight_pdfs.py
      - name: Verify Homer web samplers
        run: python3 scripts/preflight_web_previews.py
      - name: Run cover page-count preflight
        run: python3 scripts/preflight_cover_page_counts.py
      - name: Run BookVault cover safety preflight
        run: python3 scripts/preflight_bookvault_covers.py
      - name: Run two-column layout preflight
        run: python3 scripts/preflight_layout.py
      - name: Rebuild and verify architecture page map
        run: |
          python3 scripts/build_architecture_page_map.py
          git diff --exit-code -- design/architecture-page-map.csv design/volume-proof-book-starts.csv
      - name: Run accessible text-export preflight
        run: |
          python3 scripts/build_text_exports.py
          git diff --exit-code -- output/text
          python3 scripts/preflight_text_exports.py
      - name: Rebuild, validate, and reproduce EPUB editorial proofs
        run: |
          python3 scripts/build_epub.py
          git diff --exit-code -- output/epub
          python3 scripts/validate_epub.py --require-epubcheck
          shasum -a 256 output/epub/*.epub > /tmp/inq-homer-epub-first.txt
          python3 scripts/build_epub.py
          shasum -a 256 output/epub/*.epub > /tmp/inq-homer-epub-second.txt
          diff -u /tmp/inq-homer-epub-first.txt /tmp/inq-homer-epub-second.txt
      - name: Rebuild and verify meter screening artifacts
        run: |
          python3 scripts/build_meter_report.py
          git diff --exit-code -- text/meter-report.csv text/meter-report.md text/meter-outliers.csv
      - name: Check repository diff hygiene
        run: git diff --check
